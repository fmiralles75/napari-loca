# Dependabot configuration
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuring-dependabot-version-updates#enabling-github-dependabot-version-updates
# https://til.simonwillison.net/github/dependabot-python-setup

version: 2
updates:
- package-ecosystem: pip
  directory: "/"
  schedule:
    interval: monthly
  groups:
    python-packages:
      patterns:
        - "*"
  # These upper bounds are deliberate (see the comments on each pin in
  # pyproject.toml): raising them reintroduced broken installs on CI
  # (numpy/scikit-image binary mismatch; tifffile removed an API that
  # aicsimageio still uses). Loosen them by hand, after testing.
  ignore:
    - dependency-name: "numpy"
    - dependency-name: "scikit-image"
    - dependency-name: "tifffile"
