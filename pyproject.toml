[project]
name = "napari-organelle-contact-analyzer"
dynamic = ["version"]
description = "A plugin to analyze signal contacts within the cell at a designated threshold distance."
readme = "README.md"
license = {file = "LICENSE"}
authors = [
  {name = "Francisco Miralles"},
  {email = "fmiralles75@gmail.com"},
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Framework :: napari",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Mozilla Public License 2.0 (MPL 2.0)",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Image Processing",
]
requires-python = ">=3.10"  # napari>=0.6.1 requires Python 3.10+
dependencies = [
    # numpy<2 and scikit-image<0.24 keep one consistent binary stack.
    # A fresh install otherwise mixed a scikit-image wheel compiled for
    # NumPy 2 with NumPy 1.x pulled in by another dependency, and
    # importing skimage failed ("numpy.dtype size changed ... Expected 96
    # from C header, got 88"). scikit-image <0.24 is built against
    # NumPy 1.x. Revisit once every dependency supports NumPy 2.
    "numpy<2",
    "magicgui",
    "qtpy",
    # >=0.20: regionprops.perimeter_crofton (Form Factor) and the
    # tested behaviour of 3D skeletonize. Golden test values were
    # generated on 0.26 and verified identical on 0.20.
    "scikit-image>=0.20,<0.24",
    "openpyxl",
    "scipy",
    "pandas",
    "imageio",
    # [base-imageio] adds common formats (PNG, GIF, etc.) via the imageio
    # backend. TIFF/OME-TIFF work out of the box with bare aicsimageio.
    "aicsimageio[base-imageio]",
    # ND2 (Nikon) files are read directly with the nd2 package in
    # _reader.py, bypassing aicsimageio's own ND2 support entirely --
    # see _read_nd2()'s docstring for why (a "ND2File file not closed
    # before garbage collection" warning traced back to aicsimageio's
    # internal delayed/dask/mosaic-check handling of nd2 files, not to
    # our own file-closing code). Declared directly rather than via
    # aicsimageio's [nd2] extra since aicsimageio itself is no longer
    # used to read these files at all.
    "nd2>=0.7.0",
    "fsspec>=2022.8.0",
    # CZI (Zeiss) and LIF (Leica) readers are optional extras -- see
    # [project.optional-dependencies] below.
    # tifffile 2025.2.18 removed the deprecated TIFF.RESUNIT enum that
    # aicsimageio's tiff reader still depends on, causing
    # AttributeError: '_TIFF' object has no attribute 'RESUNIT'.
    # aicsimageio is now archived/unmaintained, so pin below the
    # breaking release instead of working around it at runtime.
    "tifffile<2025.2.18",
    # napari<0.6.1 has a bug where the polygon lasso ROI tool raises
    # TypeError because Shapes._last_cursor_position can be None
    # (napari/napari#7903, fixed by napari/napari#7914 in 0.6.1).
    "napari>=0.6.1",
]

[project.optional-dependencies]
# CZI (Zeiss) and LIF (Leica) support are GPL-licensed and deliberately
# excluded from aicsimageio's own "all" extra so it doesn't pull GPL code
# into non-GPL projects by default; aicsimageio's docs say to add them
# directly if you need them. Kept as opt-in extras for the same reason,
# and because aicspylibczi is a compiled package: on GitHub CI with
# Python 3.12 pip found no usable wheel alongside LocA's other pins and
# tried (and failed) to build it from source. Without these, ND2/TIFF/OME-TIFF still open;
# a .czi/.lif file is simply not claimed by this reader.
#   pip install "napari-organelle-contact-analyzer[czi]"   (Zeiss)
#   pip install "napari-organelle-contact-analyzer[lif]"   (Leica)
czi = ["aicspylibczi>=3.1.1"]
lif = ["readlif>=0.6.4"]
all-formats = ["aicspylibczi>=3.1.1", "readlif>=0.6.4"]
testing = [
    "tox",
    "pytest",  # https://docs.pytest.org/en/latest/contents.html
    "pytest-cov",  # https://pytest-cov.readthedocs.io/en/latest/
    "pytest-qt",  # https://pytest-qt.readthedocs.io/en/latest/
    "napari",
    "pyqt5",
]

[project.entry-points."napari.manifest"]
napari-organelle-contact-analyzer = "napari_organelle_contact_analyzer:napari.yaml"

[project.urls]
"Bug Tracker" = "https://github.com/fmiralles75/napari-organelle-contact-analyzer/issues"
"Documentation" = "https://github.com/fmiralles75/napari-organelle-contact-analyzer#README.md"
"Source Code" = "https://github.com/fmiralles75/napari-organelle-contact-analyzer"
"User Support" = "https://github.com/fmiralles75/napari-organelle-contact-analyzer/issues"

[build-system]
requires = ["setuptools>=42.0.0", "wheel", "setuptools_scm"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["*.yaml"]

[tool.setuptools_scm]
write_to = "src/napari_organelle_contact_analyzer/_version.py"

[tool.black]
line-length = 79
target-version = ['py38', 'py39', 'py310']

[tool.ruff]
line-length = 79
lint.select = [
    "E", "F", "W", #flake8
    "UP", # pyupgrade
    "I", # isort
    "BLE", # flake8-blind-exception
    "B", # flake8-bugbear
    "A", # flake8-builtins
    "C4", # flake8-comprehensions
    "ISC", # flake8-implicit-str-concat
    "G", # flake8-logging-format
    "PIE", # flake8-pie
    "SIM", # flake8-simplify
]
lint.ignore = [
    "E501", # line too long. let black handle this
    "UP006", "UP007", # type annotation. As using magicgui require runtime type annotation then we disable this.
    "SIM117", # flake8-simplify - some of merged with statements are not looking great with black, reanble after drop python 3.9
]

exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".mypy_cache",
    ".pants.d",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
    "*vendored*",
    "*_vendor*",
]

target-version = "py38"
fix = true

# The broad `except Exception` blocks in these two files are deliberate:
# in _widget.py they wrap Qt/napari UI handlers, file I/O and per-body
# metric steps, where an unexpected error should show a message or skip
# one body rather than crash napari; in _reader.py a file that can't be
# opened must return None so napari falls back to another reader.
[tool.ruff.lint.per-file-ignores]
"src/napari_organelle_contact_analyzer/_widget.py" = ["BLE001"]
"src/napari_organelle_contact_analyzer/_reader.py" = ["BLE001"]
