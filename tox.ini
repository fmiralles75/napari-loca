# For more information about tox, see https://tox.readthedocs.io/en/latest/
[tox]
envlist = py{310,311,312}-{linux,macos,windows}
isolated_build=true

[gh-actions]
python =
    3.10: py310
    3.11: py311
    3.12: py312

[gh-actions:env]
PLATFORM =
    ubuntu-latest: linux
    macos-latest: macos
    windows-latest: windows

[testenv]
platform =
    macos: darwin
    linux: linux
    windows: win32
passenv =
    CI
    GITHUB_ACTIONS
    DISPLAY
    XAUTHORITY
    NUMPY_EXPERIMENTAL_ARRAY_FUNCTION
    PYVISTA_OFF_SCREEN
extras =
    testing
# Prefer ready-made wheels over building old packages from source while
# pip searches for a compatible set of versions.
setenv =
    PIP_PREFER_BINARY = 1
# Print installed versions first, so a CI failure shows exactly which
# package versions were involved.
commands_pre = python -m pip list
commands = pytest -v --color=yes --cov=napari_organelle_contact_analyzer --cov-report=xml
